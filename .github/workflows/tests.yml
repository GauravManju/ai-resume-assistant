name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q
        env:
          # Tests mock every Gemini API call directly, so this only needs to
          # be non-empty for genai.Client(...) to construct without erroring.
          GEMINI_API_KEY: ci-placeholder-key
